<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Head -->
  <circle cx="100" cy="80" r="45" fill="#D4A574"/>

  <!-- Ears -->
  <ellipse cx="70" cy="40" rx="18" ry="35" fill="#C4956B" transform="rotate(-25 70 40)"/>
  <ellipse cx="130" cy="40" rx="18" ry="35" fill="#C4956B" transform="rotate(25 130 40)"/>

  <!-- Inner ears -->
  <ellipse cx="70" cy="45" rx="10" ry="22" fill="#E8D4B8" transform="rotate(-25 70 45)"/>
  <ellipse cx="130" cy="45" rx="10" ry="22" fill="#E8D4B8" transform="rotate(25 130 45)"/>

  <!-- Snout -->
  <ellipse cx="100" cy="95" rx="28" ry="24" fill="#E8D4B8"/>

  <!-- Nose -->
  <ellipse cx="100" cy="88" rx="12" ry="10" fill="#3D3D3D"/>

  <!-- Eyes -->
  <circle cx="85" cy="70" r="6" fill="#000000"/>
  <circle cx="115" cy="70" r="6" fill="#000000"/>

  <!-- Eye shine -->
  <circle cx="86" cy="68" r="2" fill="#FFFFFF"/>
  <circle cx="116" cy="68" r="2" fill="#FFFFFF"/>

  <!-- Mouth -->
  <path d="M 100 95 Q 95 105 90 102" stroke="#3D3D3D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 95 Q 105 105 110 102" stroke="#3D3D3D" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="140" rx="38" ry="45" fill="#D4A574"/>

  <!-- Front left paw -->
  <rect x="75" y="170" width="14" height="28" rx="7" fill="#C4956B"/>

  <!-- Front right paw -->
  <rect x="111" y="170" width="14" height="28" rx="7" fill="#C4956B"/>

  <!-- Tail -->
  <path d="M 130 120 Q 160 100 165 70" stroke="#C4956B" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Tongue -->
  <ellipse cx="100" cy="108" rx="8" ry="6" fill="#FF9999"/>
</svg>